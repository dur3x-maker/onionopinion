[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "onionopinion"
version = "0.1.0"
description = "Privacy-first anonymous text microblog"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.14.1",
    "argon2-cffi==23.1.0",
    "fastapi==0.141.1",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "pillow==12.3.0",
    "psycopg[binary]==3.2.4",
    "pydantic-settings==2.7.1",
    "python-multipart==0.0.32",
    "sqlalchemy==2.0.38",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
