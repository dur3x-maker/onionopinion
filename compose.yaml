name: onionopinion

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-OnionOpinion}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://opinion:${POSTGRES_PASSWORD}@db:5432/opinion}
      SECRET_KEY: ${SECRET_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      ADMIN_ALLOWED_NETWORKS: ${ADMIN_ALLOWED_NETWORKS:-}
      TRUSTED_PROXY_NETWORKS: ${TRUSTED_PROXY_NETWORKS:-}
      OFFICIAL_CLEARNET_URL: ${OFFICIAL_CLEARNET_URL:-https://onionopinion.my}
      OFFICIAL_ONION_URL: ${OFFICIAL_ONION_URL:-}
      AVATAR_STORAGE_DIR: ${AVATAR_STORAGE_DIR:-/data/avatars}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - avatar_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; host = os.environ['ALLOWED_HOSTS'].split(',')[0].strip(); request = urllib.request.Request('http://127.0.0.1:8000/healthz', headers={'Host': host}); urllib.request.urlopen(request, timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: opinion
      POSTGRES_USER: opinion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opinion -d opinion"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  # Preserve the established data-volume names across the project rename.
  postgres_data:
    name: opiniononion_postgres_data
  avatar_data:
    name: opiniononion_avatar_data
